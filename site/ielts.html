<!doctype html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IELTS Portal 🎯</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020617;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.badge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fcd34d;background:#451a03;border:1px solid rgba(245,158,11,.4);padding:5px 12px;border-radius:999px}
.bk{background:#1e293b;color:#cbd5e1;border:0;border-radius:12px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none}
h1{margin:0 0 14px;font-size:20px;font-weight:900}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;font-size:12px;font-weight:700}
.tab{padding:10px 16px;border-radius:16px;border:0;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;font:inherit;font-weight:700}
.tab.on{background:#2563eb;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="badge">🎯 IELTS</span><a class="bk" href="/">← Əsas panel</a></div>
  <h1 id="nm"></h1>
  <div class="tabs">
    <button class="tab" data-t="hw">📝 Homework</button>
    <button class="tab" data-t="pod">🎧 Article / Podcast</button>
    <button class="tab" data-t="es">✍️ Sample essays</button>
  </div>
  <div id="c"></div>
</div>
<script src="/firebase-config.js"></script>
<script src="/ielts-embed.js?v=3"></script>
<script>
(function(){
var me=null;try{me=JSON.parse(localStorage.getItem('elp_current_user_session_v3')||'null')}catch(e){}
if(!me||me.role!=='student'||!(me.track==='ielts'||/ IELTS$/.test(me.name||''))){location.replace('/');return}
document.getElementById('nm').textContent=String(me.name||'').replace(/ IELTS$/,'');
var c=document.getElementById('c');
function show(t){document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  var n=document.createElement('div');c.innerHTML='';c.appendChild(n);window.__IE(n,me,t)}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
show('hw');
})();
</script>
</body>
</html>
