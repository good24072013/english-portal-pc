<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migrate</title>
<body style="font-family:sans-serif;background:#020617;color:#e2e8f0;padding:16px;max-width:640px;margin:auto">
<h3>Köhnə Firebase → yeni Firebase</h3>
<p>Yeni layihənin <b>firebaseConfig</b> blokunu bura yapışdırın:</p>
<textarea id="c" rows="9" style="width:100%"></textarea><br><br>
<button id="b" style="padding:10px 18px">Köçür</button><pre id="o"></pre>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {initializeFirestore,getFirestore,collection,getDocs,writeBatch,doc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const OLD={projectId:"buoyant-bank-72ts5",appId:"1:101144213314:web:0bd52af4ca552987db3adb",apiKey:"AIzaSyAAskWaAnnWs0G38PK85oLcCuLUaB5Rt9Y",authDomain:"buoyant-bank-72ts5.firebaseapp.com",storageBucket:"buoyant-bank-72ts5.firebasestorage.app",messagingSenderId:"101144213314"};
const OLDDB="ai-studio-englishlearningp-0e6d328e-78eb-45e7-a429-ecf9d0eba278";
const o=document.getElementById("o"),log=s=>o.textContent+=s+"\n";
document.getElementById("b").onclick=async()=>{try{
const N={};for(const m of document.getElementById("c").value.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g))N[m[1]]=m[2];
if(!N.projectId)return log("Konfiqurasiya tapılmadı.");
const od=initializeFirestore(initializeApp(OLD,"old"),{},OLDDB),nd=getFirestore(initializeApp(N,"new"));
for(const k of ["users","vocabulary","homework","submissions","announcements","schedule","meeting_links","library","recordings"]){
const d=(await getDocs(collection(od,k))).docs;
for(let i=0;i<d.length;i+=400){const w=writeBatch(nd);d.slice(i,i+400).forEach(x=>w.set(doc(nd,k,x.id),x.data()));await w.commit()}
log(k+": "+d.length+" sənəd")}
log("Hazırdır.")}catch(e){log("Xəta: "+e.message)}};
</script>
